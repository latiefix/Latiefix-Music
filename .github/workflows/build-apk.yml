name: Build Latiefix Music APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q Latiefix-Music-Android-v2.zip -d project

          if [ -d "project/latiefix_v2" ]; then
            mv project/latiefix_v2/* project/
            mv project/latiefix_v2/.[!.]* project/ 2>/dev/null || true
          fi

          echo "Project contents:"
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 9.6
        run: |
          curl -fsSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-9.6-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        working-directory: project
        run: |
          /tmp/gradle-9.6/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Latiefix-Music-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
